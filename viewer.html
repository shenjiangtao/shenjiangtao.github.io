<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Markdown 阅读器</title>
  <link rel="stylesheet" href="./github.min.css" />
  <script src="./marked.min.js"></script>
  <script src="./highlight.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #222;
      --border: #ddd;
      --link: #007acc;
      --link-active: #d9534f;
      --code-bg: #f5f5f5;
      --sidebar-bg: #f9f9f9;
    }
    :root.dark {
      --bg: #121212;
      --fg: #e0e0e0;
      --border: #444;
      --link: #4ea3ff;
      --link-active: #ff7b72;
      --code-bg: #1e1e1e;
      --sidebar-bg: #1a1a1a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; display: flex;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh; overflow: hidden;
    }

    /* 左侧栏 */
    #sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
    }

    #toc-list { list-style: none; padding: 0; margin: 10px 0 0; }
    #toc-list li { margin: 4px 0; }
    #toc-list a { text-decoration: none; color: var(--link); font-size: 14px; }
    #toc-list a.active { font-weight: bold; color: var(--link-active); }

    button {
      cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--fg);
      padding: 4px 8px; border-radius: 4px;
      font-size: 12px; margin-top: 4px;
    }

    #search-input {
      width: 100%; padding: 6px;
      border: 1px solid var(--border);
      background: transparent; color: var(--fg);
      border-radius: 4px; margin: 8px 0;
    }

    /* 正文 */
    #content-wrapper {
      flex: 1; padding: 24px;
      overflow-y: auto; scroll-behavior: smooth;
    }

    #content img {
      max-width: 100%; border: 1px solid var(--border);
      margin: 10px 0; cursor: zoom-in;
    }

    pre {
      background: var(--code-bg) !important;
      padding: 10px; border-radius: 4px;
      overflow-x: auto;
    }

    /* 图片放大 */
    #img-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      display: none; align-items: center;
      justify-content: center; z-index: 9999;
    }
    #img-modal img { max-width: 90vw; max-height: 90vh; }

    .hidden { display: none; }
  </style>
</head>

<body>

<!-- 左侧栏 -->
<aside id="sidebar">
  <div><a href="index.html">← 返回主页</a></div>

  <button id="theme-toggle">切换暗色</button>

  <input id="search-input" placeholder="搜索..." />

  <h3>目录 <button id="toggle-toc">折叠</button></h3>
  <ul id="toc-list"></ul>
</aside>

<!-- 正文 -->
<div id="content-wrapper">
  <div id="content">加载中...</div>
</div>

<!-- 图片放大 -->
<div id="img-modal">
  <img id="img-modal-img">
</div>

<script>
// ====================== 主题切换 ======================
const root = document.documentElement;
const themeBtn = document.getElementById("theme-toggle");
const savedTheme = localStorage.getItem("md-theme") || "light";
if (savedTheme === "dark") root.classList.add("dark");
themeBtn.textContent = savedTheme === "dark" ? "切换亮色" : "切换暗色";

themeBtn.onclick = () => {
  root.classList.toggle("dark");
  const mode = root.classList.contains("dark") ? "dark" : "light";
  localStorage.setItem("md-theme", mode);
  themeBtn.textContent = mode === "dark" ? "切换亮色" : "切换暗色";
};

// ====================== Marked 渲染 ======================
marked.setOptions({
  highlight: (code, lang) => {
    try {
      if (hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    } catch {}
    return hljs.highlightAuto(code).value;
  }
});

const params = new URLSearchParams(location.search);
const file = params.get("file");

// ====================== Pandoc 宽高修复 ======================
function fixPandocImgSize(html) {
  return html.replace(/(<img[^>]+>)\{([^}]+)\}/g, (m, img, attrs) => {
    let style = "";
    const w = attrs.match(/width="([^"]+)"/);
    const h = attrs.match(/height="([^"]+)"/);
    if (w) style += `width:${w[1]};`;
    if (h) style += `height:${h[1]};`;
    return img.replace(/\/?>$/, ` style="${style}">`);
  });
}

// ====================== 图片路径修复（不会白屏） ======================
function fixImagePath(html, mdFilePath) {
  const baseDir = mdFilePath.substring(0, mdFilePath.lastIndexOf('/')) || '.';

  // ./media/xxx
  html = html.replace(/<img\s+([^>]*?)src="\.\/*media\/([^"]+)"([^>]*)>/g,
    (m, pre, filename, post) => `<img ${pre}src="${baseDir}/media/${filename}"${post}>`
  );

  // media/xxx
  html = html.replace(/<img\s+([^>]*?)src="media\/([^"]+)"([^>]*)>/g,
    (m, pre, filename, post) => `<img ${pre}src="${baseDir}/media/${filename}"${post}>`
  );

  // 纯文件名
  html = html.replace(/<img\s+([^>]*?)src="([^"\/]+\.(png|jpg|jpeg|gif|webp))"([^>]*)>/gi,
    (m, pre, filename, post) => `<img ${pre}src="${baseDir}/media/${filename}"${post}>`
  );

  return html;
}

// ====================== 加载 Markdown ======================
if (file) {
  fetch(file)
    .then(res => res.text())
    .then(text => {
      let html = marked.parse(text);
      html = fixPandocImgSize(html);
      html = fixImagePath(html, file);
      document.getElementById("content").innerHTML = html;

      buildTOC();
      setupImageModal();
      setupSearch();
    })
    .catch(err => {
      document.getElementById("content").innerHTML =
        `<p style="color:red;">加载失败：${err}</p>`;
    });
}

// ====================== 目录 ======================
function buildTOC() {
  const toc = document.getElementById("toc-list");
  const headings = document.querySelectorAll("#content h1, h2, h3");

  headings.forEach((h, i) => {
    const id = "h-" + i;
    h.id = id;

    const li = document.createElement("li");
    li.style.marginLeft = h.tagName === "H2" ? "12px" :
                          h.tagName === "H3" ? "24px" : "0";

    li.innerHTML = `<a href="#${id}">${h.textContent}</a>`;
    toc.appendChild(li);
  });

  document.querySelectorAll("#toc-list a").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      document.querySelector(a.getAttribute("href"))
        ?.scrollIntoView({ behavior: "smooth" });
    };
  });

  document.getElementById("toggle-toc").onclick = () => {
    toc.classList.toggle("hidden");
  };
}

// ====================== 图片放大 + 404 自动处理 ======================
function setupImageModal() {
  const modal = document.getElementById("img-modal");
  const modalImg = document.getElementById("img-modal-img");

  document.querySelectorAll("#content img").forEach(img => {
    img.onclick = () => {
      modalImg.src = img.src;
      modal.style.display = "flex";
    };

    img.onerror = () => {
      const name = img.src.split('/').pop();

      // 尝试 image_ 前缀
      if (!img.dataset.triedPrefix) {
        img.dataset.triedPrefix = "1";
        img.src = img.src.replace(name, "image_" + name);
        return;
      }

      img.style.borderColor = "red";
      img.alt = "图片加载失败：" + name;
      img.title = img.alt;
    };
  });

  modal.onclick = () => { modal.style.display = "none"; };
}

// ====================== 全文搜索 ======================
function setupSearch() {
  const input = document.getElementById("search-input");
  let hits = [];
  let index = -1;

  function clearMarks() {
    document.querySelectorAll("mark.search-hit").forEach(m => {
      const t = document.createTextNode(m.textContent);
      m.parentNode.replaceChild(t, m);
    });
  }

  function search(term) {
    clearMarks();
    hits = [];
    index = -1;
    if (!term) return;

    const walker = document.createTreeWalker(
      document.getElementById("content"),
      NodeFilter.SHOW_TEXT
    );

    const regex = new RegExp(term, "gi");
    let node;
    while ((node = walker.nextNode())) {
      const text = node.nodeValue;
      if (!text.trim()) continue;

      let match;
      let last = 0;
      const frag = document.createDocumentFragment();
      let found = false;

      while ((match = regex.exec(text))) {
        found = true;
        frag.appendChild(document.createTextNode(text.slice(last, match.index)));
        const mark = document.createElement("mark");
        mark.className = "search-hit";
        mark.textContent = match[0];
        frag.appendChild(mark);
        hits.push(mark);
        last = match.index + match[0].length;
      }

      if (found) {
        frag.appendChild(document.createTextNode(text.slice(last)));
        node.parentNode.replaceChild(frag, node);
      }
    }

    if (hits.length) {
      index = 0;
      hits[0].scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  input.onkeydown = e => {
    if (e.key === "Enter") search(input.value.trim());
  };
}
</script>

</body>
</html>
