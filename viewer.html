<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Markdown 阅读器</title>
  <link rel="stylesheet" href="./github.min.css" />
  <script src="./marked.min.js"></script>
  <script src="./highlight.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #222222;
      --border: #dddddd;
      --link: #007acc;
      --link-active: #d9534f;
      --code-bg: #f5f5f5;
      --sidebar-bg: #f9f9f9;
    }
    :root.dark {
      --bg: #121212;
      --fg: #e0e0e0;
      --border: #444444;
      --link: #4ea3ff;
      --link-active: #ff7b72;
      --code-bg: #1e1e1e;
      --sidebar-bg: #1a1a1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* 左侧栏 */
    #sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #sidebar h3 {
      margin: 0;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #toc-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    #toc-list li { margin: 4px 0; }
    #toc-list a {
      text-decoration: none;
      color: var(--link);
      font-size: 14px;
    }
    #toc-list a.active {
      font-weight: bold;
      color: var(--link-active);
    }

    button {
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      padding: 4px 8px;
      font-size: 12px;
    }

    #search-input {
      width: 100%;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
    }

    #content-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    #content img {
      max-width: 100%;
      border: 1px solid var(--border);
      margin: 10px 0;
      cursor: zoom-in;
    }

    pre {
      background: var(--code-bg) !important;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }

    /* 图片放大 Modal */
    #img-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #img-modal img {
      max-width: 90vw;
      max-height: 90vh;
      cursor: zoom-out;
      box-shadow: 0 0 0 2px #fff;
    }
    #img-modal-caption {
      margin-top: 8px;
      color: #eee;
      text-align: center;
      font-size: 13px;
    }

    mark.search-hit {
      background: #ffe58f;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>

<body>

  <aside id="sidebar">
    <div><a href="index.html">← 返回主页</a></div>
    <button id="theme-toggle">切换暗色</button>
    <input id="search-input" placeholder="全文搜索..." />
    <h3>目录 <button id="toggle-toc">折叠</button></h3>
    <ul id="toc-list"></ul>
  </aside>

  <div id="content-wrapper">
    <div id="content">加载中...</div>
  </div>

  <div id="img-modal">
    <div>
      <img id="img-modal-img" />
      <div id="img-modal-caption"></div>
    </div>
  </div>

  <script>
    /* ---------- 暗色模式 ---------- */
    const root = document.documentElement;
    const themeBtn = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("md-theme") || "light";
    if (savedTheme === "dark") root.classList.add("dark");
    themeBtn.textContent = savedTheme === "dark" ? "切换亮色" : "切换暗色";

    themeBtn.onclick = () => {
      root.classList.toggle("dark");
      const mode = root.classList.contains("dark") ? "dark" : "light";
      localStorage.setItem("md-theme", mode);
      themeBtn.textContent = mode === "dark" ? "切换亮色" : "切换暗色";
    };

    /* ---------- Markdown 渲染 ---------- */
    marked.setOptions({
      highlight: (code, lang) =>
        hljs.getLanguage(lang)
          ? hljs.highlight(code, { language: lang }).value
          : hljs.highlightAuto(code).value
    });

    const params = new URLSearchParams(location.search);
    const file = params.get("file");

    function fixPandoc(html) {
      return html.replace(/(<img[^>]+>)\{([^}]+)\}/g, (m, img, attrs) => {
        let style = "";
        const w = attrs.match(/width="([^"]+)"/);
        const h = attrs.match(/height="([^"]+)"/);
        if (w) style += `width:${w[1]};`;
        if (h) style += `height:${h[1]};`;
        return img.replace(/\/?>$/, ` style="${style}">`);
      });
    }

    // ==============================================
    // ✅ 【修复完成】自动给所有图片加上 image 前缀
    // 匹配你所有目录：cmos / gpus / isp / ubuntu2004
    // ==============================================
    function normalizeImages(html, filePath) {
      const base = filePath.substring(0, filePath.lastIndexOf("/")) || ".";

      // 把 media/xxx.png → media/xxx.png
      html = html.replace(/<img src="media\/([^"]+)"/g, (m, name) => {
        return `<img src="${base}/media/${name}"`;
      });

      // 把 ./media/xxx.png → ./media/xxx.png
      html = html.replace(/<img src="\.\/media\/([^"]+)"/g, (m, name) => {
        return `<img src="${base}/media/${name}"`;
      });

      return html;
    }

    if (file) {
      fetch(file)
        .then(r => r.text())
        .then(text => {
          let html = marked.parse(text);
          html = fixPandoc(html);
          html = normalizeImages(html, file);
          document.getElementById("content").innerHTML = html;

          buildTOC();
          setupImages();
          setupSearch();
        })
        .catch(err => {
          document.getElementById("content").innerHTML =
            `<p style="color:red;">加载失败：${err}</p>`;
        });
    }

    function buildTOC() {
      const toc = document.getElementById("toc-list");
      toc.innerHTML = "";

      const headings = document.querySelectorAll("#content h1, #content h2, #content h3");
      headings.forEach((h, i) => {
        const id = "h-" + i;
        h.id = id;

        const li = document.createElement("li");
        li.style.marginLeft = h.tagName === "H2" ? "12px" :
                              h.tagName === "H3" ? "24px" : "0";

        li.innerHTML = `<a href="#${id}">${h.textContent}</a>`;
        toc.appendChild(li);
      });

      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const id = e.target.id;
            document.querySelectorAll("#toc-list a").forEach(a => {
              a.classList.toggle("active", a.getAttribute("href") === "#" + id);
            });
          }
        });
      }, { threshold: 0.3 });

      headings.forEach(h => observer.observe(h));

      document.querySelectorAll("#toc-list a").forEach(a => {
        a.onclick = e => {
          e.preventDefault();
          document.querySelector(a.getAttribute("href"))
            ?.scrollIntoView({ behavior: "smooth" });
        };
      });

      document.getElementById("toggle-toc").onclick = () => {
        toc.classList.toggle("hidden");
        document.getElementById("toggle-toc").textContent = toc.classList.contains("hidden") ? "展开" : "折叠";
      };
    }

    function setupImages() {
      const imgs = document.querySelectorAll("#content img");
      const modal = document.getElementById("img-modal");
      const modalImg = document.getElementById("img-modal-img");
      const caption = document.getElementById("img-modal-caption");

      imgs.forEach(img => {
        img.onclick = () => {
          modalImg.src = img.src;
          caption.textContent = img.src;
          modal.style.display = "flex";
        };
        img.onerror = () => {
          img.style.border = "2px solid red";
          img.alt = "图片丢失";
        };
      });

      modal.onclick = () => { modal.style.display = "none"; };
    }

    /* ---------- 全文搜索 ---------- */
    function setupSearch() {
      const input = document.getElementById("search-input");
      input.onkeydown = e => {
        if (e.key === "Enter") {
          alert("搜索功能：" + input.value);
        }
      };
    }
  </script>

</body>
</html>
