<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Markdown 阅读器</title>
  <link rel="stylesheet" href="./github.min.css" />
  <script src="./marked.min.js"></script>
  <script src="./highlight.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #222;
      --border: #ddd;
      --link: #007acc;
      --link-active: #d9534f;
      --code-bg: #f5f5f5;
      --sidebar-bg: #f9f9f9;
    }
    :root.dark {
      --bg: #121212;
      --fg: #e0e0e0;
      --border: #444;
      --link: #4ea3ff;
      --link-active: #ff7b72;
      --code-bg: #1e1e1e;
      --sidebar-bg: #1a1a1a;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; display: flex; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; }
    #sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    #toc-list { list-style: none; padding: 0; margin: 10px 0 0; }
    #toc-list li { margin: 4px 0; }
    #toc-list a { text-decoration: none; color: var(--link); font-size: 14px; }
    #toc-list a.active { font-weight: bold; color: var(--link-active); }
    button { cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--fg); padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; }
    #search-input { width: 100%; padding: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg); border-radius: 4px; margin: 8px 0; }
    #content-wrapper { flex: 1; padding: 24px; overflow-y: auto; scroll-behavior: smooth; }
    #content img { max-width: 100%; border: 1px solid var(--border); margin: 10px 0; cursor: zoom-in; }
    pre { background: var(--code-bg) !important; padding: 10px; border-radius: 4px; overflow-x: auto; }
    #img-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 9999; }
    #img-modal img { max-width: 90vw; max-height: 90vh; }
    .hidden { display: none; }
  </style>
</head>

<body>

<aside id="sidebar">
  <div><a href="index.html">← 返回主页</a></div>
  <button id="theme-toggle">切换暗色</button>
  <input id="search-input" placeholder="搜索..." />
  <h3>目录 <button id="toggle-toc">折叠</button></h3>
  <ul id="toc-list"></ul>
</aside>

<div id="content-wrapper">
  <div id="content">加载中...</div>
</div>

<div id="img-modal">
  <img id="img-modal-img">
</div>

<script>
// 主题切换
const root = document.documentElement;
const themeBtn = document.getElementById("theme-toggle");
const savedTheme = localStorage.getItem("md-theme") || "light";
if (savedTheme === "dark") root.classList.add("dark");
themeBtn.textContent = savedTheme === "dark" ? "切换亮色" : "切换暗色";
themeBtn.onclick = () => {
  root.classList.toggle("dark");
  const mode = root.classList.contains("dark") ? "dark" : "light";
  localStorage.setItem("md-theme", mode);
  themeBtn.textContent = mode === "dark" ? "切换亮色" : "切换暗色";
};

// Marked 渲染
marked.setOptions({
  highlight: (code, lang) => {
    try {
      if (hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    } catch (e) {}
    return hljs.highlightAuto(code).value;
  }
});

const params = new URLSearchParams(location.search);
const file = params.get("file");

// Pandoc 宽高修复
function fixPandocImgSize(html) {
  return html.replace(/(<img[^>]+>)\{([^}]+)\}/g, (m, img, attrs) => {
    let style = "";
    const w = attrs.match(/width="([^"]+)"/);
    const h = attrs.match(/height="([^"]+)"/);
    if (w) style += `width:${w[1]};`;
    if (h) style += `height:${h[1]};`;
    return img.replace(/\/?>$/, ` style="${style}">`);
  });
}

// ==========================================================================
// ✅【核心：完美匹配你的 MD 图片格式】
// 处理：![](./media/imagexxx.png)  → 自动变成 当前目录/media/imagexxx.png
// ==========================================================================
function fixImagePath(html, mdFilePath) {
  const baseDir = mdFilePath.substring(0, mdFilePath.lastIndexOf('/')) || '.';

  // 匹配 ./media/xxx.png  → baseDir/media/xxx.png
  html = html.replace(/<img src="\.\/media\/([^"]+)"/g, (match, filename) => {
    return `<img src="${baseDir}/media/${filename}"`;
  });

  // 兼容 media/xxx.png 写法（备用）
  html = html.replace(/<img src="media\/([^"]+)"/g, (match, filename) => {
    return `<img src="${baseDir}/media/${filename}"`;
  });

  return html;
}

// 加载 MD
if (file) {
  fetch(file)
    .then(res => res.text())
    .then(text => {
      let html = marked.parse(text);
      html = fixPandocImgSize(html);
      html = fixImagePath(html, file);
      document.getElementById("content").innerHTML = html;
      buildTOC();
      setupImageModal();
    })
    .catch(err => {
      document.getElementById("content").innerHTML = `<p style="color:red;">加载失败：${err}</p>`;
    });
}

// 生成目录
function buildTOC() {
  const toc = document.getElementById("toc-list");
  const headings = document.querySelectorAll("#content h1, #content h2, #content h3");
  headings.forEach((h, i) => {
    const id = "h-" + i;
    h.id = id;
    const li = document.createElement("li");
    li.style.marginLeft = h.tagName === "H2" ? "12px" : h.tagName === "H3" ? "24px" : "0";
    li.innerHTML = `<a href="#${id}">${h.textContent}</a>`;
    toc.appendChild(li);
  });

  document.querySelectorAll("#toc-list a").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      document.querySelector(a.getAttribute("href"))?.scrollIntoView({ behavior: "smooth" });
    };
  });

  document.getElementById("toggle-toc").onclick = () => {
    toc.classList.toggle("hidden");
  };
}

// 图片点击放大
function setupImageModal() {
  const modal = document.getElementById("img-modal");
  const modalImg = document.getElementById("img-modal-img");
  document.querySelectorAll("#content img").forEach(img => {
    img.onclick = () => { modalImg.src = img.src; modal.style.display = "flex"; };
    img.onerror = () => { img.style.borderColor = "red"; };
  });
  modal.onclick = () => { modal.style.display = "none"; };
}
</script>

</body>
</html>
